name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Accepts `1.2.3` or `v1.2.3`.
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Ensure release is cut from a release branch
        env:
          CURRENT_REF: ${{ github.ref_name }}
        run: |
          case "${CURRENT_REF}" in
            release/*) ;;
            *)
              echo "Releases must be cut from a release/* branch, got ${CURRENT_REF}." >&2
              exit 1
              ;;
          esac
      - id: version
        name: Normalize and validate version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be semver-like, received: ${RAW_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

  live-openai-smoke:
    name: Live OpenAI Release Smoke
    needs:
      - prepare
      - release-validation
    uses: ./.github/workflows/live-openai-responses-smoke.yml
    secrets: inherit

  release-validation:
    name: Deterministic Release Validation
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Probe and admission regression checks
        run: |
          cargo test --locked -p proxy-core probe_endpoints_reflect_process_state --lib -- --nocapture
          cargo test --locked -p proxy-core admission_control_rejects_when_inflight_limit_is_exceeded --lib -- --nocapture
      - name: Retry and failover regression checks
        run: cargo test --locked -p proxy-core retry_tests --lib -- --nocapture
      - name: Graceful shutdown regression checks
        run: cargo test --locked -p tiny-reverse-proxy --test shutdown -- --nocapture
      - name: Tool runtime startup validation checks
        run: cargo test --locked -p plugin-llm-gateway --test tool_runtime_integration startup_validation_ -- --nocapture

  create-release:
    name: Create Git Tag And GitHub Release
    needs:
      - prepare
      - release-validation
      - live-openai-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag does not already exist
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --tags origin
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi
      - name: Create annotated tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
