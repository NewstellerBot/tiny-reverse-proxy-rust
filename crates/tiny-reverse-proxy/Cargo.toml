[package]
name = "tiny-reverse-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
proxy-core = { path = "../proxy-core" }
plugin-llm-gateway = { path = "../plugin-llm-gateway", optional = true }
arc-swap = "1"
prometheus = "0.14"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
socket2 = "0.5"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml = "0.5"

[features]
default = []
plugin-llm-gateway = ["dep:plugin-llm-gateway"]
opentelemetry = ["proxy-core/opentelemetry", "plugin-llm-gateway?/opentelemetry"]

[dev-dependencies]
trp-test-support = { path = "../trp-test-support" }
futures-util = "0.3"
glob = "0.3.1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
serde_json = "1"
tempfile = "3.2"
tokio-tungstenite = "0.24"

[[bin]]
name = "upstream-fast"
path = "../../bench/upstream_fast.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
