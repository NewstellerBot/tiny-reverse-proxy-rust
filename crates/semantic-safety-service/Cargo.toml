[package]
name = "semantic-safety-service"
version = "0.1.0"
edition = "2021"

[features]
default = []
native-tensorrt = ["semantic-safety-trt/native-tensorrt"]
dev_stub_backend = []

[dependencies]
semantic-safety-protocol = { path = "../semantic-safety-protocol" }
semantic-safety-trt = { path = "../semantic-safety-trt" }
async-trait = "0.1"
bytes = "1"
dashmap = "5"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prometheus = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.2"

[[bin]]
name = "semantic-safety-service"
path = "src/main.rs"
