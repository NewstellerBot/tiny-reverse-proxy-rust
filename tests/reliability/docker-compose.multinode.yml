services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: trp_multinode
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trp_multinode"]
      interval: 5s
      timeout: 5s
      retries: 20
